# PaySprint Merchant Portal - production configuration (excerpt)

# Only expose non-sensitive actuator endpoints; anything that can leak secrets
# (env, heapdump, etc.) stays off by default and env values are never shown.
management.endpoints.web.exposure.include=health,info
management.endpoint.env.show-values=NEVER

# Do not leak stack traces or internal error messages to API clients in production.
server.error.include-stacktrace=never
server.error.include-message=never

# Shared secret used to verify the payment provider's webhook signature.
# Must be supplied via env var
webhooks.payment-provider.secret=${PAYMENT_WEBHOOK_SECRET}
